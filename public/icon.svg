<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Grade de 4 cards estilizada -->
  <g transform="translate(96, 96)">
    <rect x="0" y="0" width="140" height="100" rx="16" fill="url(#accent)" opacity="0.95"/>
    <rect x="180" y="0" width="140" height="100" rx="16" fill="#ffffff" opacity="0.06"/>
    <rect x="0" y="140" width="140" height="100" rx="16" fill="#ffffff" opacity="0.06"/>
    <rect x="180" y="140" width="140" height="100" rx="16" fill="#ffffff" opacity="0.06"/>
    <!-- "Plus" central sutil -->
    <g transform="translate(160, 120)" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.0">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
    </g>
  </g>
</svg>
